openapi: 3.0.3
info:
  title: Cafetería ITSH — Auth & Usuarios (Sprint 1)
  version: 1.0.0
  description: >-
    Contratos REST de la fundación y autenticación. La sesión se transporta en una cookie
    httpOnly (`token`). Todas las respuestas de error usan un sobre uniforme.
servers:
  - url: /api
paths:
  /auth/register:
    post:
      summary: Registrar una cuenta de cliente (rol `usuario`, alumno/docente)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Cuenta creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: El correo ya está en uso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      summary: Iniciar sesión (emite cookie de sesión)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Sesión iniciada; cookie `token` httpOnly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          description: Credenciales inválidas (mensaje genérico, sin revelar existencia)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      summary: Cerrar sesión (limpia la cookie)
      tags: [Auth]
      responses:
        '204':
          description: Sesión cerrada
  /auth/me:
    get:
      summary: Obtener el usuario de la sesión actual
      tags: [Auth]
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /usuarios:
    get:
      summary: Listar usuarios operativos (sólo administrador)
      tags: [Usuarios]
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Crear un usuario operativo (cajero/cocinero) — sólo administrador
      tags: [Usuarios]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOperativoInput'
      responses:
        '201':
          description: Usuario operativo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: El correo ya está en uso
  /usuarios/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      summary: Editar un usuario operativo (nombre, correo, rol) — sólo administrador
      tags: [Usuarios]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOperativoInput'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Deshabilitar un usuario operativo — sólo administrador
      tags: [Usuarios]
      responses:
        '204':
          description: Usuario deshabilitado (soft delete, `activo = 0`)
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
  schemas:
    Rol:
      type: string
      enum: [administrador, cajero, cocinero, usuario]
    Usuario:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string }
        correo: { type: string, format: email }
        rol: { $ref: '#/components/schemas/Rol' }
        activo: { type: boolean }
    RegisterInput:
      type: object
      required: [nombre, correo, password]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 100 }
        correo: { type: string, format: email, maxLength: 150 }
        password: { type: string, minLength: 8 }
    LoginInput:
      type: object
      required: [correo, password]
      properties:
        correo: { type: string, format: email }
        password: { type: string }
    CreateOperativoInput:
      type: object
      required: [nombre, correo, password, rol]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 100 }
        correo: { type: string, format: email }
        password: { type: string, minLength: 8 }
        rol: { type: string, enum: [cajero, cocinero] }
    UpdateOperativoInput:
      type: object
      properties:
        nombre: { type: string, minLength: 1, maxLength: 100 }
        correo: { type: string, format: email }
        rol: { type: string, enum: [cajero, cocinero] }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            codigo: { type: string }
            mensaje: { type: string }
  responses:
    BadRequest:
      description: Datos inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Sesión ausente o inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: El rol del usuario no permite la operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
