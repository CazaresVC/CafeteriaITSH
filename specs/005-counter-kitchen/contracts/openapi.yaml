openapi: 3.0.3
info:
  title: Cafetería ITSH — Mostrador y cocina (Sprint 4)
  version: 1.0.0
  description: >-
    Contratos REST de la operación interna: captura y cobro de pedidos de mostrador por el
    cajero, y pantalla de cocina (KDS) que lista y avanza los pedidos entrantes (anticipados y
    de mostrador) por la máquina de estados. La sesión se transporta en una cookie httpOnly
    (`token`). Todas las respuestas de error usan un sobre uniforme.
  x-traceability:
    masterSpec: 001-advance-order-system
    functionalRequirements: [FR-019, FR-020, FR-021, FR-022, FR-023, FR-024, FR-025, FR-031, FR-032, FR-033, FR-034, FR-035]
servers:
  - url: /api
security:
  - cookieAuth: []
paths:
  /pedidos/mostrador:
    post:
      summary: Capturar un pedido de mostrador (sólo cajero)
      description: >-
        Crea un pedido con `tipo='mostrador'`, `creado_por` = cajero de la sesión y estado
        inicial `Pendiente`. El total se calcula en el servidor a partir de `menu_dia`.
      tags: [Pedidos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearMostradorInput'
      responses:
        '201':
          description: Pedido de mostrador creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /pedidos/{id}/cobro:
    parameters:
      - $ref: '#/components/parameters/PedidoId'
    post:
      summary: Registrar el cobro de un pedido de mostrador (sólo cajero)
      description: >-
        Registra un `pago` con `metodo='efectivo'`, `monto = pedido.total` y
        `registrado_por` = cajero, y transiciona el pedido `Pendiente → Pagado`. Un pedido ya
        pagado o en otro estado se rechaza con 409.
      tags: [Pagos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CobroInput'
      responses:
        '200':
          description: Cobro registrado; pedido en estado "Pagado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /pedidos:
    get:
      summary: Listar pedidos para caja y cocina (cajero o cocinero)
      description: >-
        Devuelve los pedidos ordenados por llegada (`creado_en ASC`, empate por `id ASC`).
        Admite filtros por estado y por origen; la cocina usa `estado=Pagado,En preparación,Listo`
        y sin filtro de origen para mezclar anticipados y de mostrador.
      tags: [Pedidos, Cocina]
      parameters:
        - name: estado
          in: query
          required: false
          description: Nombre de estado (puede repetirse para varios valores)
          schema:
            type: array
            items:
              $ref: '#/components/schemas/EstadoNombre'
          style: form
          explode: true
        - name: origen
          in: query
          required: false
          description: Origen del pedido (`tipo` en la base de datos)
          schema:
            $ref: '#/components/schemas/Origen'
      responses:
        '200':
          description: Lista de pedidos ordenada por llegada, con sus líneas de detalle
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pedido'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /pedidos/{id}:
    parameters:
      - $ref: '#/components/parameters/PedidoId'
    get:
      summary: Obtener el detalle de un pedido (cajero o cocinero)
      tags: [Pedidos]
      responses:
        '200':
          description: >-
            Pedido con líneas de detalle; el personal (cajero/cocinero) recibe además el
            historial de estados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /pedidos/{id}/estado:
    parameters:
      - $ref: '#/components/parameters/PedidoId'
    patch:
      summary: Cambiar el estado de un pedido (cajero o cocinero)
      description: >-
        Valida la transición contra la tabla `transicion_estado`, actualiza `pedido.estado_id` y
        registra `pedido_estado_historial` con `cambiado_por` = usuario de la sesión. Los saltos
        de estado y los cambios sobre `Entregado`/`Cancelado` se rechazan con 409. Si otro
        operador ya cambió el pedido, también se responde 409.
      tags: [Pedidos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioEstadoInput'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
  parameters:
    PedidoId:
      name: id
      in: path
      required: true
      schema: { type: integer }
  schemas:
    Origen:
      type: string
      enum: [anticipado, mostrador]
    EstadoNombre:
      type: string
      enum: [Pendiente, Pagado, En preparación, Listo, Entregado, Cancelado]
    CrearMostradorInput:
      type: object
      required: [items]
      properties:
        cliente_nombre:
          type: string
          maxLength: 100
          nullable: true
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemInput'
    ItemInput:
      type: object
      required: [menu_dia_id, cantidad]
      properties:
        menu_dia_id: { type: integer }
        cantidad: { type: integer, minimum: 1 }
    CobroInput:
      type: object
      required: [metodo]
      properties:
        metodo:
          type: string
          enum: [efectivo]
    CambioEstadoInput:
      type: object
      required: [estado]
      properties:
        estado:
          $ref: '#/components/schemas/EstadoNombre'
    PedidoResumen:
      type: object
      properties:
        id: { type: integer }
        numero: { type: string }
        tipo: { $ref: '#/components/schemas/Origen' }
        estado: { $ref: '#/components/schemas/EstadoNombre' }
        clienteNombre: { type: string, nullable: true }
        fechaRecoleccion: { type: string, nullable: true }
        total: { type: number, format: decimal }
        creadoEn: { type: string, format: date-time }
    Pedido:
      allOf:
        - $ref: '#/components/schemas/PedidoResumen'
        - type: object
          properties:
            lineas:
              type: array
              items:
                $ref: '#/components/schemas/LineaPedido'
            pago:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/Pago'
            historial:
              type: array
              items:
                $ref: '#/components/schemas/HistorialEstado'
    LineaPedido:
      type: object
      properties:
        id: { type: integer }
        platilloId: { type: integer }
        nombre: { type: string }
        cantidad: { type: integer }
        precioUnitario: { type: number, format: decimal }
        subtotal: { type: number, format: decimal }
    Pago:
      type: object
      properties:
        id: { type: integer }
        metodo: { type: string, enum: [online, efectivo] }
        monto: { type: number, format: decimal }
        referencia: { type: string, nullable: true }
    HistorialEstado:
      type: object
      properties:
        estadoAnterior: { $ref: '#/components/schemas/EstadoNombre' }
        estadoNuevo: { $ref: '#/components/schemas/EstadoNombre' }
        cambiadoPor: { type: integer, nullable: true }
        fecha: { type: string, format: date-time }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            codigo: { type: string }
            mensaje: { type: string }
  responses:
    BadRequest:
      description: Datos inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Sesión ausente o inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: El rol del usuario no permite la operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Pedido no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: >-
        Operación inválida: transición de estado no permitida (salto o estado terminal) o
        pedido ya modificado/cobrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
